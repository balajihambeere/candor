  <use href="#icon-web" x="285" y="368" width="40" height="40" />
  <text x="345" y="382" font-size="14" font-weight="600" fill="#0f172a">Next.js dashboard (apps/dashboard)</text>
  <text x="345" y="401" font-size="11" fill="#64748b">Server Components: overview, decisions, review queue, ledger (reads)</text>
  <text x="345" y="417" font-size="11" fill="#64748b">Server Actions: resolve / disclose / reopen (writes) &#8212; plain HTML forms</text>
  <text x="345" y="433" font-size="11" fill="#64748b">Signed session cookie gates every route except /login</text>

  <!-- double arrow api <-> dashboard -->
  <path d="M520,260 L520,348" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" fill="none" />
