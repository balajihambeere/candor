  <text x="355" y="153" text-anchor="middle" font-size="10" fill="#64748b">rule evaluation</text>

  <rect x="450" y="90" width="150" height="80" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="525" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">trace()</text>
  <text x="525" y="140" text-anchor="middle" font-size="10" fill="#64748b">deterministic</text>
  <text x="525" y="153" text-anchor="middle" font-size="10" fill="#64748b">counterfactual replay</text>

  <rect x="620" y="90" width="140" height="80" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
  <use href="#icon-ai" x="628" y="98" width="26" height="26" />
  <text x="695" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">justify()</text>
  <text x="695" y="149" text-anchor="middle" font-size="10" fill="#64748b">Claude / OpenAI +</text>
  <text x="695" y="161" text-anchor="middle" font-size="10" fill="#64748b">faithfulness checks</text>

  <path d="M430,130 L448,130" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M600,130 L618,130" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <text x="520" y="200" text-anchor="middle" font-size="11" fill="#4338ca">persist: cases &#183; decisions &#183; trace_results</text>
  <text x="520" y="216" text-anchor="middle" font-size="11" fill="#4338ca">justifications &#183; review_queue (if unverified)</text>
  <text x="520" y="238" text-anchor="middle" font-size="10" fill="#64748b">also: /v1/decisions/{id}/disclose &#183; /reopen &#183; /v1/review-queue &#183; /v1/disclosures</text>

  <!-- Postgres -->
  <rect x="850" y="145" width="160" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <use href="#icon-database" x="910" y="163" width="40" height="40" />
