services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: candor
      POSTGRES_PASSWORD: candor
      POSTGRES_DB: candor
    ports:
      - "5544:5432"
    volumes:
      - candor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candor -d candor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://candor:candor@db:5432/candor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic -c database/alembic.ini upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  candor_pgdata:
