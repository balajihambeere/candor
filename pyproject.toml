[project]
name = "candor"
version = "0.1.0"
description = "A Decide/Trace/Justify/Disclose engine for verified, disclosed AI decision explanations — turns a correct-but-unexplainable automated decision into a fast, checkable, honestly-delivered reason."
keywords = [
    "ai-explainability",
    "decision-transparency",
    "llm",
    "anthropic",
    "claude",
    "fastapi",
    "trust-and-safety",
    "audit-trail",
    "counterfactual-explanation",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.39",
    "openai>=1.50",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = []
